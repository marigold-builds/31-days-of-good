name: check-credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Bluesky credentials are present
        env:
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD_SET: ${{ secrets.BLUESKY_APP_PASSWORD != '' }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${BLUESKY_HANDLE:-}" ]; then
            echo "::error::BLUESKY_HANDLE is empty. Expected a repository VARIABLE (vars.BLUESKY_HANDLE), not a secret. Check it was stored as a variable, not a secret."
            missing=1
          fi
          if [ "${BLUESKY_APP_PASSWORD_SET}" != "true" ]; then
            echo "::error::BLUESKY_APP_PASSWORD is empty. Expected a repository SECRET (secrets.BLUESKY_APP_PASSWORD)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Both BLUESKY_HANDLE (variable) and BLUESKY_APP_PASSWORD (secret) are present."

      - name: Authenticate to Bluesky (session check only, no post)
        env:
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status=$(
            jq -n '{identifier: env.BLUESKY_HANDLE, password: env.BLUESKY_APP_PASSWORD}' \
            | curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
                --request POST 'https://bsky.social/xrpc/com.atproto.server.createSession' \
                --header 'Content-Type: application/json' \
                --data @-
          )

          if ! jq empty "$response_file" >/dev/null 2>&1; then
            echo "::error::Bluesky returned HTTP ${http_status} with a response body that was not valid JSON. Refusing to print it."
            exit 1
          fi

          case "$http_status" in
            2[0-9][0-9]) : ;;
            *)
              error_code=$(jq -r '.error // "unknown"' "$response_file")
              error_message=$(jq -r '.message // "no message"' "$response_file")
              echo "::error::Bluesky authentication failed (HTTP ${http_status}): ${error_code} - ${error_message}"
              exit 1
              ;;
          esac

          did=$(jq -r '.did // empty' "$response_file")
          handle=$(jq -r '.handle // empty' "$response_file")

          if [ -z "$did" ] || [ -z "$handle" ]; then
            echo "::error::Bluesky authentication returned HTTP ${http_status} but the response was missing did or handle. Response shape may have changed; refusing to print it."
            exit 1
          fi

          echo "Authenticated. did=${did} handle=${handle}"

          if [ "$handle" != "$BLUESKY_HANDLE" ]; then
            echo "::error::Resolved handle (${handle}) does not match vars.BLUESKY_HANDLE (${BLUESKY_HANDLE})."
            exit 1
          fi

          echo "Handle matches vars.BLUESKY_HANDLE."
